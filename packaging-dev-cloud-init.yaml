#cloud-config
---
package_update: true

packages:
  # Core packaging requirements
  - build-essential
  - devscripts
  - debhelper
  - sbuild
  - mmdebstrap
  - piuparts
  - schroot
  - debootstrap
  - ubuntu-dev-tools
  # Basic CLI tools
  - git
  - jq
  - htop
  - zsh
  - fzf
  - gh
  - python3-pip
  - python3-venv

snap:
  commands:
    - snap install --classic git-ubuntu
    - snap install --classic opencode

runcmd:
  - DEBIAN_FRONTEND=noninteractive apt-get remove -y landscape-client landscape-common adwaita-icon-theme humanity-icon-theme
  - DEBIAN_FRONTEND=noninteractive apt-get -y upgrade
  - DEBIAN_FRONTEND=noninteractive apt-get -y autoremove

  # Disable swap & IPv6
  - |
    sysctl -w vm.swappiness=0
    echo "vm.swappiness = 0" | tee -a /etc/sysctl.conf
    swapoff -a

    echo "net.ipv6.conf.all.disable_ipv6=1" | tee -a /etc/sysctl.conf
    echo "net.ipv6.conf.default.disable_ipv6=1" | tee -a /etc/sysctl.conf
    echo "net.ipv6.conf.lo.disable_ipv6=1" | tee -a /etc/sysctl.conf
    sysctl -p

  # Disable non-essential services safely
  - |
    systemctl disable man-db.timer man-db.service --now || true
    systemctl disable apport.service apport-autoreport.service --now || true
    systemctl disable apt-daily.service apt-daily.timer --now || true
    systemctl disable apt-daily-upgrade.service apt-daily-upgrade.timer --now || true
    systemctl disable unattended-upgrades.service --now || true
    systemctl disable motd-news.service motd-news.timer --now || true
    systemctl disable bluetooth.target --now || true
    systemctl disable ua-messaging.service ua-messaging.timer --now || true
    systemctl disable ua-timer.timer ua-timer.service --now || true
    systemctl disable systemd-tmpfiles-clean.timer --now || true

  # Add ubuntu user to sbuild group
  - usermod -aG sbuild ubuntu

  # Setup Oh-My-Zsh, custom theme, plugins, and PATH
  - |
    export GIT_TERMINAL_PROMPT=0
    chown -R ubuntu:ubuntu /home/ubuntu

    sudo -u ubuntu sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended || true
    sudo -u ubuntu git clone https://github.com/zsh-users/zsh-autosuggestions.git /home/ubuntu/.oh-my-zsh/custom/plugins/zsh-autosuggestions || true
    sudo -u ubuntu git clone https://github.com/zsh-users/zsh-syntax-highlighting.git /home/ubuntu/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting || true

    # Download custom theme & activate it in .zshrc
    sudo -u ubuntu wget -P /home/ubuntu/.oh-my-zsh/themes/ https://raw.githubusercontent.com/Abuelodelanada/charm-dev-utils/main/zsh_themes/juju.zsh-theme || true
    sudo -u ubuntu sed -i 's/ZSH_THEME="robbyrussell"/ZSH_THEME="juju"/g' /home/ubuntu/.zshrc
    sudo -u ubuntu sed -i 's/plugins=(git)/plugins=(fzf git zsh-autosuggestions zsh-syntax-highlighting virtualenv colored-man-pages colorize)/g' /home/ubuntu/.zshrc
    sudo -u ubuntu sh -c "echo 'export PATH=\$PATH:\$HOME/.local/bin' >> /home/ubuntu/.zshrc"

  # Switch default shell to Zsh
  - chsh -s /bin/zsh ubuntu

  # Generate noble sbuild chroot environment
  - sudo -u ubuntu mk-sbuild noble

final_message: "Packaging VM ready in $UPTIME seconds."